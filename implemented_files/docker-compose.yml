services:
  postgres:
    image: postgres:16
    container_name: teamproject-postgres
    environment:
      POSTGRES_DB: teamproject
      POSTGRES_USER: teamproject
      POSTGRES_PASSWORD: teamproject
    ports:
      - "5432:5432"
    volumes:
      - teamproject_pgdata:/var/lib/postgresql/data

volumes:
  teamproject_pgdata:
